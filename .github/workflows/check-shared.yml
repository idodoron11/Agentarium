name: Check shared skill resources

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: scripts/sync-shared.sh --check
      - run: tests/sync-shared.test.sh
      - run: tests/check-skills.test.sh
      - run: tests/breaking-release-tag.test.sh
      - run: scripts/check-skills.sh --check
