name: Check shared skill resources

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/sync-shared.sh --check
      - run: tests/check-skills.test.sh
      - run: scripts/check-skills.sh --check
