name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # amannn/action-semantic-pull-request v6.1.1
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  next-version:
    name: Next version preview
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      # A squash merge makes the PR title the only new commit message, so the title alone decides the bump
      # and the PR's own commits are ignored. The script prints the version; the tag action only echoes it back.
      - name: Preview the squash commit's version
        id: preview
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "custom_tag=$(scripts/breaking-release-tag.sh --title "$PR_TITLE")" >> "$GITHUB_OUTPUT"

      - name: Compute the next version (dry run)
        id: tag
        # mathieudutour/github-tag-action v6.2
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fetch_all_tags: true
          custom_tag: ${{ steps.preview.outputs.custom_tag }}
          dry_run: true

      - name: Report the next version
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "Merging this PR would release **${NEW_TAG}**." >> "$GITHUB_STEP_SUMMARY"
