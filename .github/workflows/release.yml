name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag action's commit analyzer doesn't recognise the "!" breaking marker, so force the major bump.
      - name: Detect a "!" breaking marker
        id: breaking
        run: echo "custom_tag=$(scripts/breaking-release-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Tag the next version
        id: tag
        # mathieudutour/github-tag-action v6.2
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: minor
          custom_release_rules: feat:major:Features,fix:minor:Fixes
          fetch_all_tags: true
          custom_tag: ${{ steps.breaking.outputs.custom_tag }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: gh release create "$NEW_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$NEW_TAG" --generate-notes
